<html lang="en">
<head>
<meta charset="utf-8">
<title>MarkItDown Desktop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 16V8l3 4 3-4v8M16.5 9v7m0 0-2-2m2 2 2-2"/></svg>
      <span>MarkItDown <em>Desktop</em></span>
    </div>
    <div class="toolbar-actions">
      <button id="btn-add" class="btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add PDFs
      </button>
      <button id="btn-save-all" class="btn primary" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>Download all .md
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Add PDF files">
        <svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9M12 12v8m0-8-3 3m3-3 3 3"/></svg>
        <strong>Drop PDF files here</strong>
        <span>or click to choose</span>
      </div>
      <div class="list-head">
        <span>Files <b id="count">0</b></span>
        <button id="btn-clear" class="link" hidden>Clear all</button>
      </div>
      <ul id="file-list" class="file-list"></ul>
    </aside>

    <section class="preview">
      <div id="empty" class="empty">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        <h2>Convert PDFs to Markdown</h2>
        <p>Add one or more PDF files. Each one is converted locally with Microsoft MarkItDown. Nothing leaves your Mac.</p>
      </div>

      <div id="viewer" class="viewer" hidden>
        <div class="viewer-head">
          <div class="viewer-title">
            <h2 id="v-name"></h2>
            <span id="v-meta" class="meta"></span>
          </div>
          <div class="viewer-actions">
            <div class="seg" role="tablist">
              <button id="tab-raw" class="active" role="tab">Markdown</button>
              <button id="tab-rendered" role="tab">Preview</button>
            </div>
            <button id="btn-copy" class="btn">
              <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span>Copy</span>
            </button>
            <button id="btn-save" class="btn primary">
              <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>Download .md
            </button>
          </div>
        </div>
        <div id="v-status" class="status" hidden></div>
        <pre id="v-raw" class="raw"></pre>
        <article id="v-rendered" class="rendered" hidden></article>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="drag-overlay" class="drag-overlay"><div>Drop to convert</div></div>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
