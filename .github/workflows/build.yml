name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14   # Apple Silicon (arm64)
          - runner: macos-13   # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: ./scripts/build_macos.sh
      - name: Smoke test
        run: |
          cupsfilter README.md > sample.pdf 2>/dev/null
          "dist/MarkItDown Desktop.app/Contents/MacOS/MarkItDown Desktop" --convert sample.pdf | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.runner }}
          path: dist/*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
